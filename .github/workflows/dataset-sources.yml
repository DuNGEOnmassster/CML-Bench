name: Dataset source gates
on:
  pull_request:
    paths: ['dataset_sources/**', '.github/workflows/dataset-sources.yml']
  push:
    paths: ['dataset_sources/**', '.github/workflows/dataset-sources.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s dataset_sources/tests -v
      - run: python -m compileall -q dataset_sources
